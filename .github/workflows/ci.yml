name: SuperBook CI

on:
  push:
    branches:
      - main
      - 'test/**'
      - 'architecture/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test
