<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SuperBook Real Scene POC v3</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07090d;color:#eee;font:14px system-ui;display:grid;place-items:center;padding:14px}main{width:min(709px,100%)}.stage{position:relative;aspect-ratio:709/890;overflow:hidden;border:1px solid #343b47;border-radius:18px;background:#111;box-shadow:0 24px 80px #0008}canvas{width:100%;height:100%;display:block}nav{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:7px;flex-wrap:wrap}button,.tag{border:1px solid #3a4350;background:#151b24dd;color:#e8edf4;border-radius:999px;padding:7px 11px}button{cursor:pointer}.tag{margin-left:auto}p{color:#aeb7c5;line-height:1.45}b{color:#eef2f8}small{color:#7f8a99;font-family:monospace;display:block;white-space:pre-wrap;word-break:break-word}.diag{margin-top:10px;padding:10px 12px;border:1px solid #242b35;border-radius:12px;background:#0c1016;color:#8792a2;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}</style><main><section class="stage"><canvas id="c" width="709" height="890"></canvas><nav><button onclick="setM('idle')">Static</button><button onclick="setM('conversation')">Conversation</button><button onclick="setM('reaction')">Reaction</button><button onclick="setM('scene')">Play scene</button><span class="tag" id="m">static</span></nav></section><p><b>Real-scene POC v3.</b> Character masks are derived at runtime from the actual layer/background pixel difference. No hand-drawn rectangles. No per-frame AI.</p><small id="s">loading source layers…</small><div class="diag" id="d">diagnostics: starting…</div></main><script>
const C=document.getElementById('c'),x=C.getContext('2d'),M=document.getElementById('m'),S=document.getElementById('s'),D=document.getElementById('d');
const commit='33b6b2325d57380806d58e9a86bd7e573e6d9984';
const base='https://raw.githubusercontent.com/shivashisvicky/SuperBook/'+commit+'/poc/living_scene_real/';
const src={bg:base+'bg.jpeg',lh:base+'lh.webp',rh:base+'rh.webp'};const POS={l:{x:74,y:170},r:{x:574,y:195}};const I={};let mode='idle',t=0,last=performance.now(),layers={};
function load(k){return new Promise((ok,no)=>{const i=new Image();const started=performance.now();i.crossOrigin='anonymous';i.onload=()=>{D.textContent+='\\n'+k+': OK · '+i.naturalWidth+'×'+i.naturalHeight+' · '+Math.round(performance.now()-started)+'ms · CORS anonymous';ok(i)};i.onerror=()=>{D.textContent+='\\n'+k+': LOAD FAILED · '+src[k];no(Error(k+' image load failed'))};i.src=src[k];I[k]=i})}
function buildMask(srcImg,bgImg,pos){const w=srcImg.naturalWidth,h=srcImg.naturalHeight,o=document.createElement('canvas');o.width=w;o.height=h;const q=o.getContext('2d');q.drawImage(bgImg,-pos.x,-pos.y,w,h,0,0,w,h);const bg=q.getImageData(0,0,w,h);q.clearRect(0,0,w,h);q.drawImage(srcImg,0,0);const a=q.getImageData(0,0,w,h);for(let i=0;i<a.data.length;i+=4){const dr=Math.abs(a.data[i]-bg.data[i]),dg=Math.abs(a.data[i+1]-bg.data[i+1]),db=Math.abs(a.data[i+2]-bg.data[i+2]);const v=dr+dg+db;let al=Math.max(0,Math.min(255,(v-24)*3.2));if(al<12)al=0;a.data[i+3]=al}q.putImageData(a,0,0);let bb=null;for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++)if(a.data[(y*w+xx)*4+3]>20){if(!bb)bb={x:xx,y,xx,yy:y};else{bb.x=Math.min(bb.x,xx);bb.y=Math.min(bb.y,y);bb.xx=Math.max(bb.xx,xx);bb.yy=Math.max(bb.yy,y)}}if(!bb)return null;const pad=4;bb.x=Math.max(0,bb.x-pad);bb.y=Math.max(0,bb.y-pad);bb.xx=Math.min(w-1,bb.xx+pad);bb.yy=Math.min(h-1,bb.yy+pad);const crop=document.createElement('canvas');crop.width=bb.xx-bb.x+1;crop.height=bb.yy-bb.y+1;crop.getContext('2d').drawImage(o,bb.x,bb.y,crop.width,crop.height,0,0,crop.width,crop.height);return{x:pos.x+bb.x,y:pos.y+bb.y,canvas:crop}}
function setM(m){mode=m;M.textContent=m==='idle'?'static':m;t=0}
async function init(){try{D.textContent='diagnostics: loading remote image bytes…\\ncommit: '+commit+'\\nassets: raw.githubusercontent.com\\n';await Promise.all([load('bg'),load('lh'),load('rh')]);D.textContent+='\\nmask: building left…';layers.l=buildMask(I.lh,I.bg,POS.l);D.textContent+='\\nmask: building right…';layers.r=buildMask(I.rh,I.bg,POS.r);if(!layers.l||!layers.r)throw Error('difference mask empty');D.textContent+='\\nmask: PASS · left '+layers.l.canvas.width+'×'+layers.l.canvas.height+' · right '+layers.r.canvas.width+'×'+layers.r.canvas.height+'\\nrender: PASS · AI/frame: 0';S.textContent='mask extraction: pixel-difference · AI/frame: 0 · ready';requestAnimationFrame(frame)}catch(e){D.textContent+='\\nFATAL: '+(e.name||'Error')+' · '+(e.message||String(e));S.textContent='POC error: '+(e.message||String(e))}}
function drawLayer(L,rot,dy){x.save();const cx=L.x+L.canvas.width/2,cy=L.y+L.canvas.height/2;x.translate(cx,cy+dy);x.rotate(rot);x.translate(-cx,-cy);x.drawImage(L.canvas,L.x,L.y);x.restore()}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;x.clearRect(0,0,C.width,C.height);x.drawImage(I.bg,0,0);let la=0,ra=0,ly=0,ry=0;if(mode==='conversation'){la=Math.sin(t*1.5)*.045;ra=Math.sin(t*1.3+1)*-.045;ly=Math.sin(t*1.5)*3.5;ry=Math.sin(t*1.25+1)*3.2}else if(mode==='reaction'){la=.025;ra=-.04;ry=-5}else if(mode==='scene'){const q=t%7;if(q<2){la=.035;ra=-.025}else if(q<4){la=.03;ly=Math.sin((q-2)*2.3)*5}else{ra=-.04;ry=-5}}drawLayer(layers.l,la,ly);drawLayer(layers.r,ra,ry);S.textContent='local-only · derived masks · state: '+mode+' · AI/frame: 0';requestAnimationFrame(frame)}
init();</script>
