<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SuperBook Real Scene POC v3</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07090d;color:#eee;font:14px system-ui;display:grid;place-items:center;padding:14px}main{width:min(709px,100%)}.stage{position:relative;aspect-ratio:709/890;overflow:hidden;border:1px solid #343b47;border-radius:18px;background:#111;box-shadow:0 24px 80px #0008}canvas{width:100%;height:100%;display:block}nav{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:7px;flex-wrap:wrap}button,.tag{border:1px solid #3a4350;background:#151b24dd;color:#e8edf4;border-radius:999px;padding:7px 11px}button{cursor:pointer}.tag{margin-left:auto}p{color:#aeb7c5;line-height:1.45}b{color:#eef2f8}small{color:#7f8a99;font-family:monospace}</style><main><section class="stage"><canvas id="c" width="709" height="890"></canvas><nav><button onclick="setM('idle')">Static</button><button onclick="setM('conversation')">Conversation</button><button onclick="setM('reaction')">Reaction</button><button onclick="setM('scene')">Play scene</button><span class="tag" id="m">static</span></nav></section><p><b>Real-scene POC v3.</b> Character masks are derived at runtime from the actual layer/background pixel difference. No hand-drawn rectangles. No per-frame AI.</p><small id="s">loading source layers…</small></main><script>
const C=document.getElementById('c'),x=C.getContext('2d'),M=document.getElementById('m'),S=document.getElementById('s');
const src={bg:'bg.jpeg',lh:'lh.webp',rh:'rh.webp'};const I={};let mode='idle',t=0,last=performance.now(),layers={};
function load(k){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src[k];I[k]=i})}
function buildMask(srcImg,bgImg){const w=srcImg.naturalWidth,h=srcImg.naturalHeight,o=document.createElement('canvas');o.width=w;o.height=h;const q=o.getContext('2d');q.drawImage(srcImg,0,0);const a=q.getImageData(0,0,w,h),b=document.createElement('canvas');b.width=w;b.height=h;const z=b.getContext('2d');z.drawImage(bgImg,0,0,w,h);const d=z.getImageData(0,0,w,h);for(let i=0;i<a.data.length;i+=4){const dr=Math.abs(a.data[i]-d.data[i]),dg=Math.abs(a.data[i+1]-d.data[i+1]),db=Math.abs(a.data[i+2]-d.data[i+2]);const v=dr+dg+db;let al=Math.max(0,Math.min(255,(v-42)*2.4));if(al<18)al=0;a.data[i+3]=al}q.putImageData(a,0,0);let bb=null;for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){if(a.data[(y*w+xx)*4+3]>24){if(!bb)bb={x:xx,y,xx,yy:y};else{bb.x=Math.min(bb.x,xx);bb.y=Math.min(bb.y,y);bb.xx=Math.max(bb.xx,xx);bb.yy=Math.max(bb.yy,y)}}}if(!bb)return null;const pad=8;bb.x=Math.max(0,bb.x-pad);bb.y=Math.max(0,bb.y-pad);bb.xx=Math.min(w-1,bb.xx+pad);bb.yy=Math.min(h-1,bb.yy+pad);const crop=document.createElement('canvas');crop.width=bb.xx-bb.x+1;crop.height=bb.yy-bb.y+1;crop.getContext('2d').drawImage(o,bb.x,bb.y,crop.width,crop.height,0,0,crop.width,crop.height);return{x:bb.x,y:bb.y,canvas:crop}}
function setM(m){mode=m;M.textContent=m==='idle'?'static':m;t=0}
async function init(){try{await Promise.all([load('bg'),load('lh'),load('rh')]);layers.l=buildMask(I.lh,I.bg);layers.r=buildMask(I.rh,I.bg);if(!layers.l||!layers.r)throw Error('difference mask empty');S.textContent='mask extraction: pixel-difference · AI/frame: 0 · ready';requestAnimationFrame(frame)}catch(e){S.textContent='POC error: '+e.message}}
function drawLayer(L,rot,dy){x.save();const cx=L.x+L.canvas.width/2,cy=L.y+L.canvas.height/2;x.translate(cx,cy+dy);x.rotate(rot);x.translate(-cx,-cy);x.drawImage(L.canvas,L.x,L.y);x.restore()}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;x.clearRect(0,0,C.width,C.height);x.drawImage(I.bg,0,0);let la=0,ra=0,ly=0,ry=0;if(mode==='conversation'){la=Math.sin(t*1.5)*.012;ra=Math.sin(t*1.3+1)*-.012;ly=Math.sin(t*1.5)*.7;ry=Math.sin(t*1.25+1)*.6}else if(mode==='reaction'){la=.006;ra=-.014;ry=-1}else if(mode==='scene'){const q=t%7;if(q<2){la=.008;ra=-.006}else if(q<4){la=.005;ly=Math.sin((q-2)*2.3)*.8}else{ra=-.014;ry=-1}}drawLayer(layers.l,la,ly);drawLayer(layers.r,ra,ry);S.textContent='local-only · derived masks · state: '+mode+' · AI/frame: 0';requestAnimationFrame(frame)}
init();</script>
