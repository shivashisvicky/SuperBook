<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SuperBook Living Scene POC</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07090d;color:#eee;font:14px/1.4 system-ui,sans-serif;display:grid;place-items:center;padding:18px}.shell{width:min(980px,100%)}.stage{position:relative;aspect-ratio:16/10;overflow:hidden;border:1px solid #2b3039;border-radius:20px;background:#121722;box-shadow:0 24px 80px #0008}.stage svg{width:100%;height:100%;display:block}.hud{position:absolute;inset:14px 14px auto;display:flex;gap:8px;flex-wrap:wrap}.hud button{border:1px solid #3a4350;background:#151b24;color:#e8edf4;border-radius:999px;padding:7px 12px;cursor:pointer}.label{margin-left:auto;padding:7px 11px;border-radius:999px;background:#090c12b8;color:#bfc8d6}.caption{margin-top:12px;color:#aeb7c5}.caption b{color:#eef2f8}.status{margin-top:6px;color:#7f8a99;font:12px ui-monospace,monospace}
</style></head><body><main class="shell"><section class="stage">
<svg id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
<defs><linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#273447"/><stop offset="1" stop-color="#111722"/></linearGradient><linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3a2d29"/><stop offset="1" stop-color="#171215"/></linearGradient><radialGradient id="lamp"><stop stop-color="#ffdca0" stop-opacity=".9"/><stop offset="1" stop-color="#ffdca0" stop-opacity="0"/></radialGradient><filter id="soft"><feGaussianBlur stdDeviation="18"/></filter></defs>
<g id="camera"><rect width="1600" height="700" fill="url(#wall)"/><rect y="700" width="1600" height="300" fill="url(#floor)"/><path d="M0 700H1600" stroke="#67504a" stroke-width="8" opacity=".45"/><g opacity=".28"><path d="M180 90V690M540 90V690M900 90V690M1260 90V690" stroke="#6f7e92" stroke-width="3"/><path d="M120 90H1480" stroke="#6f7e92" stroke-width="3"/></g>
<g id="table"><ellipse cx="800" cy="765" rx="390" ry="62" fill="#08090b" opacity=".4"/><rect x="470" y="620" width="660" height="90" rx="18" fill="#4b3227"/><rect x="520" y="690" width="28" height="250" fill="#38231d"/><rect x="1052" y="690" width="28" height="250" fill="#38231d"/><rect x="715" y="610" width="170" height="30" rx="4" fill="#6e2528" transform="rotate(-5 800 625)"/></g>
<g id="lamp"><circle cx="1230" cy="210" r="210" fill="url(#lamp)" filter="url(#soft)"/><path d="M1230 60V170" stroke="#b7a58f" stroke-width="10"/><path d="M1165 175H1295L1272 275H1188Z" fill="#d4b47d"/><circle cx="1230" cy="218" r="25" fill="#fff0bd"/></g>
<g id="characterA"><ellipse cx="540" cy="842" rx="125" ry="30" fill="#050609" opacity=".55"/><g id="aLegs"><path d="M490 800V925" stroke="#2b2220" stroke-width="34" stroke-linecap="round"/><path d="M590 800V925" stroke="#2b2220" stroke-width="34" stroke-linecap="round"/><path d="M470 925H515" stroke="#161316" stroke-width="22" stroke-linecap="round"/><path d="M565 925H610" stroke="#161316" stroke-width="22" stroke-linecap="round"/></g><g id="aBody"><path d="M430 820Q440 610 540 585Q640 610 650 820Z" fill="#43536d"/><path d="M475 610Q540 655 605 610L580 830H500Z" fill="#c7a46a"/></g><g id="aArm"><path d="M455 650Q375 705 395 770" fill="none" stroke="#43536d" stroke-width="58" stroke-linecap="round"/><circle cx="397" cy="770" r="28" fill="#d7b58e"/></g><g id="aNeck"><rect x="518" y="585" width="44" height="45" rx="18" fill="#d7b58e"/></g><g id="aHead"><ellipse cx="540" cy="500" rx="95" ry="110" fill="#d7b58e"/><path d="M445 500Q430 360 540 350Q650 360 635 500Q610 435 540 438Q470 435 445 500Z" fill="#3b2b2b"/><g id="aEyes"><circle cx="505" cy="515" r="8"/><circle cx="575" cy="515" r="8"/></g><path d="M515 565Q540 580 565 565" fill="none" stroke="#7e3e3e" stroke-width="6" stroke-linecap="round"/></g></g>
<g id="characterB"><ellipse cx="1080" cy="842" rx="125" ry="30" fill="#050609" opacity=".55"/><g id="bLegs"><path d="M1030 800V925" stroke="#292522" stroke-width="34" stroke-linecap="round"/><path d="M1130 800V925" stroke="#292522" stroke-width="34" stroke-linecap="round"/><path d="M1010 925H1055" stroke="#161316" stroke-width="22" stroke-linecap="round"/><path d="M1105 925H1150" stroke="#161316" stroke-width="22" stroke-linecap="round"/></g><g id="bBody"><path d="M970 820Q980 610 1080 585Q1180 610 1190 820Z" fill="#536c5d"/><path d="M1015 610Q1080 650 1145 610L1120 830H1040Z" fill="#e1d1a6"/></g><g id="bArm"><path d="M1145 650Q1225 705 1220 775" fill="none" stroke="#536c5d" stroke-width="58" stroke-linecap="round"/><circle cx="1220" cy="775" r="28" fill="#d7b58e"/></g><g id="bNeck"><rect x="1058" y="585" width="44" height="45" rx="18" fill="#d7b58e"/></g><g id="bHead"><ellipse cx="1080" cy="500" rx="95" ry="110" fill="#d7b58e"/><path d="M985 500Q970 355 1080 350Q1190 355 1175 500Q1150 430 1080 438Q1010 430 985 500Z" fill="#544034"/><g id="bEyes"><circle cx="1045" cy="515" r="8"/><circle cx="1115" cy="515" r="8"/></g><path id="bSmile" d="M1055 565Q1080 575 1105 565" fill="none" stroke="#7e3e3e" stroke-width="6" stroke-linecap="round"/><ellipse id="bOpenMouth" cx="1080" cy="568" rx="22" ry="12" fill="#7e3e3e" opacity="0"/></g></g>
</g></svg>
<div class="hud"><button data-mode="idle">Idle</button><button data-mode="glance">Glance</button><button data-mode="gesture">Gesture</button><button data-mode="reaction">Reaction</button><button data-mode="scene">Play scene</button><span class="label" id="mode">idle</span></div>
</section><div class="caption"><b>Living-scene POC.</b> Layered characters, pivots, local spring motion, blink timing, gesture/reaction states, and a narrative timeline. No AI calls, video, external assets, or paid services.</div><div class="status" id="status">runtime: local-only · state: idle · AI/frame: 0</div></main>
<script>
const q=s=>document.querySelector(s),A=q('#characterA'),B=q('#characterB'),ah=q('#aHead'),bh=q('#bHead'),ae=q('#aEyes'),be=q('#bEyes'),aa=q('#aArm'),ba=q('#bArm'),bs=q('#bSmile'),bom=q('#bOpenMouth'),cam=q('#camera'),mode=q('#mode'),status=q('#status');
const s={mode:'idle',t:0,sceneT:0,blinkA:2.1,blinkB:3.4,headA:0,headB:0,armA:0,armB:0,armAV:0,armBV:0};
function spring(k,target,dt){const v=k+'V';s[v]+=(target-s[k])*55*dt-s[v]*13*dt;s[k]+=s[v]*dt}
function setMode(m){s.mode=m;s.sceneT=0;mode.textContent=m==='reaction'?'reaction · surprised':m}document.querySelectorAll('button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
function frame(dt){s.t+=dt;if(s.mode==='scene')s.sceneT+=dt;const breath=Math.sin(s.t*1.65)*4;let ha=0,hb=0,ta=0,tb=0,c=0;
if(s.mode==='glance'){ha=.07*Math.sin(s.t*2.1);hb=-.055*Math.sin(s.t*1.7+.8)}
if(s.mode==='gesture'){ha=.06;ta=.42+.12*Math.sin(s.t*7)}
if(s.mode==='reaction'){hb=-.22;tb=-.62;ta=.28;ha=.09}
if(s.mode==='scene'){const t=s.sceneT;if(t<1.6){ha=.065;hb=-.04}else if(t<3.4){ha=.04;ta=.42*Math.sin((t-1.6)*2.1);hb=.06}else if(t<4.8){hb=-.12;tb=-.35}else{ha=.02*Math.sin(t*2);hb=.015*Math.sin(t*1.7);c=.018*Math.sin((t-4.8)*1.2)}if(t>6.4)s.sceneT=0}
s.headA+=(ha-s.headA)*Math.min(1,dt*7);s.headB+=(hb-s.headB)*Math.min(1,dt*7);spring('armA',ta,dt);spring('armB',tb,dt);
const blink=(k,period)=>{s[k]-=dt;if(s[k]<=0)s[k]=period+Math.random()*2.5;return s[k]<.12?Math.max(.08,s[k]/.12):1};
const ea=blink('blinkA',3.1),eb=blink('blinkB',3.8);
ah.setAttribute('transform',`rotate(${s.headA*57.3} 540 500)`);bh.setAttribute('transform',`rotate(${s.headB*57.3} 1080 500)`);ae.setAttribute('transform',`translate(540 515) scale(1 ${ea}) translate(-540 -515)`);const reactionFace=s.mode==='reaction';be.setAttribute('transform',`translate(1080 515) scale(${reactionFace?1.42:1} ${reactionFace?1.32:eb}) translate(-1080 -515)`);bs.setAttribute('opacity',reactionFace?'0':'1');bom.setAttribute('opacity',reactionFace?'1':'0');
aa.setAttribute('transform',`rotate(${s.armA*57.3} 455 650)`);ba.setAttribute('transform',`rotate(${s.armB*57.3} 1145 650)`);
A.setAttribute('transform',`translate(0 ${breath})`);B.setAttribute('transform',`translate(0 ${breath*.8})`);cam.setAttribute('transform',`translate(${c*80} ${c*20}) scale(${1+Math.abs(c)*.035})`);
status.textContent=`runtime: local-only · state: ${s.mode} · scene time: ${s.sceneT.toFixed(1)}s · springs: active · AI/frame: 0`;requestAnimationFrame(now=>{const last=frame.last??now;frame.last=now;frame(Math.min(.05,(now-last)/1000))})}frame(0);
</script></body></html>
