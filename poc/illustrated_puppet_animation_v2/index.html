document.querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;t=0;document.querySelectorAll('button').forEach(q=>q.classList.toggle('active',q===b))});
document.querySelector('button[data-m="story"]').classList.add('active');
function ready(){return Object.values(imgs).every(i=>i.complete)}
function ease(v){return v<.5?2*v*v:1-Math.pow(-2*v+2,2)/2}
function draw(im,px,py,cx,cy,a,sx=1,sy=1){x.save();x.translate(px+cx,py+cy);x.rotate(a);x.scale(sx,sy);x.translate(-cx,-cy);x.drawImage(im,0,0);x.restore()}

function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
 if(!ready()){requestAnimationFrame(frame);return}
 x.clearRect(0,0,709,890);
 const q=t%16;
 let camX=0,camY=0,camS=1;

 } else if(mode==='eat'){
   rightHead=-.06+ .04*Math.sin(t*.7);

   leftHand=.025*Math.sin(t*.9); rightHand=-.022*Math.sin(t*.8+1);
   camX=Math.sin(t*.35)*.8;
   leftBreath=pulse(t,.006,1.3);rightBreath=pulse(t+1,.006,1.25);
 }
 x.save();
 x.translate(354.5,460);x.scale(camS,camS);x.translate(-354.5+camX,-460+camY);
 x.drawImage(imgs.bg,0,0,709,890);
 draw(imgs.lh,74,170,55,105,leftHead,1,leftBreath);
 draw(imgs.rh,574,195,55,105,rightHead,1,rightBreath);
 draw(imgs.lhand,70,525,55,60,leftHand,leftBreath,1);
 draw(imgs.rhand,575,545,55,60,rightHand,rightBreath,1);
 const glow=.035+.015*Math.sin(t*.7);
 const g=x.createRadialGradient(355,270,20,355,270,470);g.addColorStop(0,'rgba(255,222,163,'+glow+')');g.addColorStop(1,'rgba(255,222,163,0)');x.fillStyle=g;x.fillRect(0,0,709,920);
 x.restore();
 const vg=x.createRadialGradient(354,430,230,354,430,520);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.38)');x.fillStyle=vg;x.fillRect(0,0,709,920);
