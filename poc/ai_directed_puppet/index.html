<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SuperBook · AI Directed Puppet POC</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#07090d;color:#eef2f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:16px;display:flex;justify-content:center}.wrap{width:min(760px,100%)}
h1{font-size:18px;margin:4px 0 4px}.sub{color:#8994a5;font-size:13px;margin-bottom:12px}
.stage{position:relative;background:#10151b;border:1px solid #303947;border-radius:20px;overflow:hidden;box-shadow:0 18px 60px #0008}
svg{display:block;width:100%;height:auto;background:#182027}
.controls{display:flex;gap:7px;flex-wrap:wrap;padding:10px;background:#0d1117;border-top:1px solid #303947}
button{border:1px solid #3a4655;background:#171e27;color:#edf2f8;border-radius:999px;padding:8px 12px;font-size:13px}button.active{background:#293544}
.panel{margin-top:10px;border:1px solid #2e3744;border-radius:14px;background:#0d1117;padding:11px;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#9ba7b7;white-space:pre-wrap}
.good{color:#b8e6c3}
</style>
</head>
<body><main class="wrap">
<h1>AI-directed puppet · runtime gate</h1>
<div class="sub">AI chooses intent + timing. The local engine executes reusable actions. Zero per-frame AI.</div>
<section class="stage">
<svg id="scene" viewBox="0 0 760 720" aria-label="Animated room scene">
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#303d42"/><stop offset="1" stop-color="#172127"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6b5142"/><stop offset="1" stop-color="#302528"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="760" height="720" fill="url(#wall)"/>
<circle cx="560" cy="180" r="150" fill="#d5a867" opacity=".12" filter="url(#soft)"/>
<rect x="70" y="65" width="250" height="185" rx="10" fill="#202b31" stroke="#445057" stroke-width="4"/>
<rect x="88" y="83" width="214" height="149" fill="#435149"/>
<path d="M88 185 Q150 145 205 190 T302 170 V232 H88Z" fill="#627061"/>
<rect x="455" y="82" width="190" height="10" rx="5" fill="#705744"/><path d="M510 82 L545 30 L580 82Z" fill="#c99b5c" opacity=".7"/>
<rect y="455" width="760" height="265" fill="url(#floor)"/>
<ellipse cx="380" cy="610" rx="350" ry="90" fill="#191c1e" opacity=".22"/>
<!-- table -->
<g id="table"><rect x="285" y="430" width="250" height="28" rx="8" fill="#74523e"/><path d="M310 458 L335 680 M510 458 L485 680" stroke="#49352e" stroke-width="22" stroke-linecap="round"/><ellipse cx="410" cy="430" rx="125" ry="18" fill="#8b6249"/></g>
<!-- bowl -->
<g id="meal"><path d="M370 405 Q410 438 450 405 Q442 450 410 452 Q378 450 370 405Z" fill="#b8b0a0"/><ellipse cx="410" cy="405" rx="40" ry="9" fill="#ddd5bf"/><circle cx="396" cy="402" r="5" fill="#8a704b"/><circle cx="417" cy="400" r="5" fill="#7c6645"/><circle cx="431" cy="405" r="5" fill="#9b7a50"/></g>
<!-- chair -->
<g id="chair"><rect x="120" y="395" width="95" height="18" rx="5" fill="#76523f"/><rect x="130" y="410" width="14" height="150" fill="#4c3831"/><rect x="190" y="410" width="14" height="150" fill="#4c3831"/><rect x="130" y="315" width="14" height="100" fill="#4c3831"/><rect x="190" y="315" width="14" height="100" fill="#4c3831"/><rect x="130" y="315" width="74" height="18" rx="5" fill="#76523f"/></g>
<!-- walker -->
<g id="walker" transform="translate(110 350)">
 <ellipse cx="0" cy="220" rx="45" ry="10" fill="#11161a" opacity=".35"/>
 <g id="wlegs"><path d="M-18 168 L-30 215" stroke="#34465a" stroke-width="18" stroke-linecap="round"/><path d="M18 168 L31 215" stroke="#34465a" stroke-width="18" stroke-linecap="round"/><path d="M-37 216 L-20 216 M17 216 L37 216" stroke="#202b35" stroke-width="10" stroke-linecap="round"/></g>
 <path d="M-48 72 Q-42 25 0 18 Q42 25 48 72 L55 176 Q0 202 -55 176Z" fill="#344d67"/>
 <g id="wleftArm" transform="translate(-42 84)"><path d="M0 0 L-30 72" stroke="#344d67" stroke-width="18" stroke-linecap="round"/><circle cx="-30" cy="72" r="11" fill="#d5a17f"/></g>
 <g id="wrightArm" transform="translate(42 84)"><path d="M0 0 L30 72" stroke="#344d67" stroke-width="18" stroke-linecap="round"/><circle cx="30" cy="72" r="11" fill="#d5a17f"/></g>
 <circle id="whead" cx="0" cy="0" r="48" fill="#d5a17f"/><path d="M-47 0 Q-42 -58 4 -55 Q48 -48 48 2 Q25 -25 0 -28 Q-25 -25 -47 0Z" fill="#342d2c"/>
 <circle cx="-15" cy="3" r="3.5"/><circle cx="16" cy="3" r="3.5"/>
</g>
<!-- seated listener -->
<g id="listener" transform="translate(605 315)">
 <ellipse cx="0" cy="255" rx="62" ry="13" fill="#11161a" opacity=".35"/>
 <path d="M-58 78 Q-48 30 0 24 Q48 30 58 78 L65 225 Q0 250 -65 225Z" fill="#586b4b"/>
 <circle id="lthead" cx="0" cy="0" r="48" fill="#d1a07e"/><path d="M-47 0 Q-40 -58 7 -55 Q50 -48 48 5 Q25 -25 0 -28 Q-25 -25 -47 0Z" fill="#7d6049"/>
 <circle cx="-15" cy="3" r="3.5"/><circle cx="16" cy="3" r="3.5"/>
 <g id="ltarm"><path d="M-44 88 L-70 165" stroke="#586b4b" stroke-width="18" stroke-linecap="round"/><circle cx="-70" cy="165" r="11" fill="#d1a07e"/></g>
</g>
<!-- spoon held by walker during eating -->
<g id="spoon"><path d="M0 0 L0 72" stroke="#d7d0c0" stroke-width="5"/><ellipse cx="0" cy="0" rx="9" ry="13" fill="#e4ddce"/></g>
</svg>
<div class="controls">
<button data-m="idle">Idle</button><button data-m="look">Look</button><button data-m="gesture">Gesture</button><button data-m="nod">Nod</button><button data-m="reaction">Reaction</button><button data-m="scene">AI Scene</button>
</div>
</section>
<div id="status" class="panel"></div>
</main>
<script>
const E=id=>document.getElementById(id);
const P={w:E('walker'),l:E('listener'),wa:E('wleftArm'),wr:E('wrightArm'),wl:E('wlegs'),wh:E('whead'),la:E('ltarm'),lh:E('lthead'),sp:E('spoon')};
const aiPlan={schemaVersion:2,intent:"enter_room_meet_friend_share_meal",timeline:[
 {action:"walk",from:0,to:2.8,target:"table",tempo:.9},
 {action:"talk",from:2.8,to:5.0,target:"listener",gesture:"right_hand"},
 {action:"eat",from:5.0,to:7.0,object:"bowl",repetitions:2},
 {action:"talk",from:7.0,to:9.0,target:"listener",gesture:"right_hand"},
 {action:"idle",from:9.0,to:10.0}
],aiPerFrame:0};
let mode="scene",t=0,last=performance.now();
function setMode(m){mode=m;t=0;document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.m===m))}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}
function set(el,v){el.setAttribute('transform',v)}
function reset(){set(P.w,'translate(110 350)');set(P.l,'translate(605 315)');set(P.wa,'translate(-42 84)');set(P.wr,'translate(42 84)');set(P.wl,'');set(P.la,'');set(P.sp,'translate(0 0)');}
function apply(a,p){
 reset(); const s=Math.sin(p*Math.PI), bounce=Math.sin(p*Math.PI*2);
 if(a==='walk'){const x=110+(605-110)*ease(p);set(P.w,'translate('+x+' 350)');set(P.wl,'rotate('+(bounce*18)+' 0 170)');set(P.wa,'translate(-42 84) rotate('+(bounce*-22)+' 0 0)');set(P.wr,'translate(42 84) rotate('+(bounce*22)+' 0 0)');set(P.wh,'rotate('+(bounce*3)+' 0 0)')}
 if(a==='talk'){set(P.w,'translate(500 350)');set(P.wr,'translate(42 84) rotate('+(-28*s)+' 0 0)');set(P.wa,'translate(-42 84) rotate('+(12*s)+' 0 0)');set(P.wh,'rotate('+(bounce*5)+' 0 0)');set(P.lh,'rotate('+(bounce*4)+' 0 0)');set(P.la,'rotate('+(bounce*10)+' 0 0)')}
 if(a==='eat'){set(P.w,'translate(500 350)');const lift=75*s;set(P.wr,'translate(42 84) rotate('+(-48*s)+' 0 0)');set(P.sp,'translate('+(545-35*s)+' '+(420-lift)+') rotate('+(bounce*3)+' 0 0)');set(P.wh,'translate(0 '+(-8*s)+')');set(P.lh,'rotate('+(bounce*2)+' 0 0)')}
}
function sceneAt(z){if(z<2.8)return['walk',z/2.8];if(z<5)return['talk',(z-2.8)/2.2];if(z<7)return['eat',(z-5)/2];if(z<9)return['talk',(z-7)/2];return['idle',(z-9)/1]}
function frame(now){t+=Math.min(.05,(now-last)/1000);last=now;let a=mode,p=0;if(mode==='scene'){[a,p]=sceneAt(t%10)}else p=(t%2)/2;apply(a,p);E('status').innerHTML='<span class="good">PASS · scene runtime alive</span>\nmode: '+mode+'\ncurrent action: '+a+'\nAI supplied: intent + action timeline + targets\nengine executes: walk / talk / eat / idle\nAI/frame: 0\n\nAI scene plan:\n'+JSON.stringify(aiPlan,null,2);requestAnimationFrame(frame)}
setMode('scene');requestAnimationFrame(frame);
</script>
</body></html>
