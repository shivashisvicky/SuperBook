<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SuperBook · Illustrated Story Scene POC</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#101318;color:#eef2f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:14px;display:flex;justify-content:center}.wrap{width:min(980px,100%)}
h1{font-size:18px;margin:3px 0}.sub{font-size:12px;color:#929baa;margin:0 0 11px}
.stage{position:relative;overflow:hidden;border:1px solid #38404b;border-radius:18px;background:#171b20;box-shadow:0 20px 70px #0009}
svg{display:block;width:100%;height:auto}
.controls{display:flex;gap:7px;flex-wrap:wrap;padding:10px;background:#0d1015;border-top:1px solid #303640}
button{border:1px solid #3a4350;background:#171d25;color:#edf2f7;border-radius:999px;padding:8px 12px;font-size:12px}
button.active{background:#344052}
.panel{margin-top:9px;border:1px solid #2e3641;border-radius:12px;background:#0d1015;padding:9px;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:#9da8b7;white-space:pre-wrap}
.good{color:#b9e8c3}
</style>
</head>
<body><main class="wrap">
<h1>SuperBook · illustrated story scene</h1>
<div class="sub">Reference direction: painted storybook environment + articulated 2D characters + deterministic local acting. AI supplies the scene plan, not the frames.</div>
<section class="stage">
<svg id="scene" viewBox="0 0 960 640" aria-label="Illustrated animated story scene">
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9cbb8"/><stop offset="1" stop-color="#bca990"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8a6046"/><stop offset="1" stop-color="#4c3430"/></linearGradient>
 <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5c78ad"/><stop offset="1" stop-color="#334d83"/></linearGradient>
 <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#70462e"/><stop offset="1" stop-color="#3e271f"/></linearGradient>
 <linearGradient id="sari" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b5549"/><stop offset="1" stop-color="#62333a"/></linearGradient>
 <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8f9eb8"/><stop offset="1" stop-color="#5e6e8c"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="5"/></filter>
 <pattern id="wallTexture" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M0 19 Q9 13 18 19 T38 19" fill="none" stroke="#fff" opacity=".035"/></pattern>
</defs>

<!-- painterly room -->
<rect width="960" height="640" fill="url(#wall)"/>
<rect width="960" height="455" fill="url(#wallTexture)"/>
<rect y="445" width="960" height="195" fill="url(#floor)"/>
<ellipse cx="500" cy="548" rx="430" ry="70" fill="#221b1c" opacity=".25" filter="url(#blur)"/>
<rect x="55" y="55" width="250" height="205" rx="9" fill="#3e4a4b" stroke="#5f665e" stroke-width="7"/>
<rect x="70" y="70" width="220" height="175" fill="#6c806f"/>
<path d="M70 190 Q130 135 190 183 T290 164 V245 H70Z" fill="#8ea086" opacity=".9"/>
<path d="M70 205 Q145 160 215 212 T290 193" fill="none" stroke="#b7c5a6" stroke-width="7" opacity=".55"/>
<path d="M180 70 V245 M70 158 H290" stroke="#344241" stroke-width="7"/>
<g opacity=".75"><circle cx="115" cy="110" r="17" fill="#d4c47b"/><circle cx="254" cy="117" r="22" fill="#d8b56c"/></g>

<!-- cabinet -->
<g id="cabinet">
 <rect x="650" y="150" width="245" height="285" rx="7" fill="url(#wood)" stroke="#33221d" stroke-width="6"/>
 <rect x="674" y="177" width="198" height="82" fill="#5b4637" stroke="#2f241f" stroke-width="5"/>
 <rect x="674" y="278" width="198" height="132" fill="#533d31" stroke="#2f241f" stroke-width="5"/>
 <path d="M740 177 V259 M806 177 V259 M773 278 V410" stroke="#33251f" stroke-width="5"/>
 <circle cx="762" cy="218" r="4" fill="#c7a66e"/><circle cx="789" cy="218" r="4" fill="#c7a66e"/>
 <g opacity=".95"><rect x="688" y="191" width="28" height="47" rx="4" fill="#7187aa"/><rect x="722" y="204" width="30" height="34" rx="3" fill="#d0a55c"/><rect x="816" y="194" width="38" height="44" rx="4" fill="#748e6f"/></g>
 <g><rect x="689" y="295" width="48" height="13" fill="#b7a06e"/><rect x="744" y="294" width="33" height="14" fill="#8e5f69"/><rect x="784" y="293" width="69" height="15" fill="#6b7e9e"/><rect x="689" y="323" width="75" height="12" fill="#8a6d55"/><rect x="775" y="321" width="78" height="14" fill="#a9a16f"/></g>
</g>

<!-- lamp -->
<g><path d="M545 60 V145" stroke="#4a3930" stroke-width="8"/><path d="M518 72 Q545 48 572 72 L559 99 H531Z" fill="#d7ad69" stroke="#70533d" stroke-width="4"/><circle cx="545" cy="145" r="6" fill="#e5bd6e"/></g>

<!-- bed -->
<g id="bed">
 <rect x="70" y="350" width="565" height="154" rx="12" fill="url(#wood)" stroke="#34231e" stroke-width="7"/>
 <rect x="84" y="365" width="537" height="139" rx="9" fill="url(#bed)"/>
 <path d="M84 414 Q170 392 252 415 T418 413 T621 417" fill="none" stroke="#8298c0" stroke-width="5" opacity=".7"/>
 <path d="M84 454 Q170 432 252 455 T418 453 T621 457" fill="none" stroke="#263d72" stroke-width="5" opacity=".8"/>
 <rect x="74" y="335" width="18" height="184" rx="8" fill="#493026"/><rect x="603" y="335" width="18" height="184" rx="8" fill="#493026"/>
 <rect x="105" y="320" width="150" height="82" rx="18" fill="#c8d2c5"/><path d="M121 348 Q180 327 241 348" fill="none" stroke="#a2b2a1" stroke-width="5"/>
 <path d="M112 401 Q185 382 260 401" fill="none" stroke="#7f8d7f" stroke-width="4"/>
</g>

<!-- small table -->
<g id="sideTable"><rect x="25" y="410" width="105" height="18" rx="5" fill="#704a35"/><path d="M37 428 L44 548 M118 428 L110 548" stroke="#4b332b" stroke-width="13"/><path d="M39 403 Q76 370 113 403 V413 H39Z" fill="#8b654c"/><path d="M55 398 Q76 377 97 398" fill="none" stroke="#5d4537" stroke-width="7"/><ellipse cx="75" cy="396" rx="19" ry="8" fill="#b8d1d6"/></g>

<!-- meal tray -->
<g id="tray"><ellipse cx="500" cy="335" rx="76" ry="18" fill="#a97848"/><ellipse cx="500" cy="330" rx="69" ry="14" fill="#d0b17d"/><path d="M472 325 Q500 344 528 325 Q524 356 500 360 Q476 356 472 325Z" fill="#ded7c4"/><circle cx="489" cy="326" r="5" fill="#8b6a48"/><circle cx="507" cy="328" r="5" fill="#94734f"/></g>

<!-- left character, articulated -->
<g id="woman" transform="translate(-150 310)">
 <ellipse cx="0" cy="248" rx="74" ry="15" fill="#171719" opacity=".28"/>
 <g id="wbody"><path d="M-53 77 Q-45 30 0 22 Q45 30 53 77 L66 205 Q0 232 -66 205Z" fill="url(#sari)" stroke="#4b2d31" stroke-width="4"/><path d="M-55 87 Q0 120 55 87 L42 155 Q0 173 -42 155Z" fill="#b08c53" opacity=".9"/><path d="M-47 122 Q0 145 47 122" fill="none" stroke="#d4aa61" stroke-width="5"/></g>
 <g id="wleftArm" transform="translate(-45 78)"><path d="M0 0 L-36 78" stroke="#b88469" stroke-width="22" stroke-linecap="round"/><circle cx="-38" cy="80" r="13" fill="#c99577" stroke="#70483d" stroke-width="3"/></g>
 <g id="wrightArm" transform="translate(45 78)"><path d="M0 0 L36 78" stroke="#b88469" stroke-width="22" stroke-linecap="round"/><circle cx="38" cy="80" r="13" fill="#c99577" stroke="#70483d" stroke-width="3"/></g>
 <g id="whead"><ellipse cx="0" cy="-5" rx="50" ry="55" fill="#c99476" stroke="#633e36" stroke-width="4"/><path d="M-49 -10 Q-43 -70 4 -67 Q49 -62 50 -7 Q27 -34 0 -39 Q-27 -34 -49 -10Z" fill="#58514e"/><path d="M-40 -45 Q-5 -79 37 -48" fill="none" stroke="#79706a" stroke-width="7"/><circle cx="-17" cy="-2" r="5" fill="#25252a"/><circle cx="17" cy="-2" r="5" fill="#25252a"/><path d="M-10 20 Q0 27 11 20" fill="none" stroke="#6d3d3d" stroke-width="3"/><circle cx="0" cy="10" r="11" fill="none" stroke="#7b5a4d" stroke-width="2"/></g>
 <g id="wlegs"><path d="M-25 197 L-35 242" stroke="#9c715c" stroke-width="19" stroke-linecap="round"/><path d="M25 197 L36 242" stroke="#9c715c" stroke-width="19" stroke-linecap="round"/></g>
</g>

<!-- right character, articulated -->
<g id="man" transform="translate(785 360)">
 <ellipse cx="0" cy="215" rx="70" ry="14" fill="#171719" opacity=".28"/>
 <g id="mbody"><path d="M-57 70 Q-46 28 0 23 Q46 28 57 70 L70 180 Q0 210 -70 180Z" fill="url(#shirt)" stroke="#46546e" stroke-width="4"/><path d="M-50 110 Q0 128 50 110" fill="none" stroke="#b4bed0" stroke-width="4" opacity=".7"/></g>
 <g id="mleftArm" transform="translate(-48 75)"><path d="M0 0 L-32 70" stroke="#a8785f" stroke-width="22" stroke-linecap="round"/><circle cx="-33" cy="72" r="13" fill="#b47f65" stroke="#65443a" stroke-width="3"/></g>
 <g id="mrightArm" transform="translate(48 75)"><path d="M0 0 L34 67" stroke="#a8785f" stroke-width="22" stroke-linecap="round"/><circle cx="35" cy="69" r="13" fill="#b47f65" stroke="#65443a" stroke-width="3"/></g>
 <g id="mhead"><ellipse cx="0" cy="-4" rx="51" ry="57" fill="#ae7a61" stroke="#603f35" stroke-width="4"/><path d="M-50 -7 Q-45 -63 2 -68 Q49 -61 51 -5 Q26 -34 0 -39 Q-27 -34 -50 -7Z" fill="#37383c"/><path d="M-36 -53 Q0 -76 37 -53" fill="none" stroke="#57585c" stroke-width="7"/><circle cx="-17" cy="-2" r="5" fill="#202127"/><circle cx="17" cy="-2" r="5" fill="#202127"/><path d="M-11 22 Q0 29 11 22" fill="none" stroke="#603a39" stroke-width="3"/></g>
</g>

<!-- foreground warmth -->
<rect x="0" y="0" width="960" height="640" fill="#e4b875" opacity=".035"/>
<path d="M0 610 Q210 575 390 605 T760 596 T960 610 V640 H0Z" fill="#20191a" opacity=".25"/>
</svg>
<div class="controls">
<button data-m="scene">AI Scene</button><button data-m="enter">Enter</button><button data-m="talk">Talk</button><button data-m="gesture">Gesture</button><button data-m="eat">Eat</button><button data-m="listen">Listen</button><button data-m="idle">Idle</button>
</div>
</section>
<div id="status" class="panel"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const G={w:$("woman"),wh:$("whead"),wa:$("wleftArm"),wr:$("wrightArm"),wl:$("wlegs"),m:$("man"),mh:$("mhead"),ma:$("mleftArm"),mr:$("mrightArm"),tray:$("tray")};
const aiPlan={schemaVersion:3,intent:"woman_enters_quiet_room_to_share_a_meal_with_an_older_man",timeline:[
 {action:"enter",from:0,to:2.5,target:"bedside",camera:"wide"},
 {action:"talk",from:2.5,to:4.8,target:"man",gesture:"right_hand",camera:"two_shot"},
 {action:"gesture",from:4.8,to:6.0,target:"meal",camera:"medium"},
 {action:"eat",from:6.0,to:8.2,object:"bowl",repetitions:2,camera:"medium"},
 {action:"listen",from:8.2,to:10.0,target:"man",camera:"two_shot"},
 {action:"idle",from:10.0,to:11.0}
],aiPerFrame:0};
let mode="scene",t=0,last=performance.now();
function reset(){G.w.setAttribute("transform","translate(-150 310)");G.m.setAttribute("transform","translate(785 360)");G.wa.setAttribute("transform","translate(-45 78)");G.wr.setAttribute("transform","translate(45 78)");G.wh.setAttribute("transform","");G.ma.setAttribute("transform","translate(-48 75)");G.mr.setAttribute("transform","translate(48 75)");G.mh.setAttribute("transform","");G.tray.setAttribute("transform","");}
function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}
function apply(a,p){
 reset(); const s=Math.sin(p*Math.PI),b=Math.sin(p*Math.PI*2);
 if(a==="enter"){const x=-150+(470)*ease(p);G.w.setAttribute("transform","translate("+x+" 310)");G.wl.setAttribute("transform","translate(0 0) rotate("+(b*11)+" 0 200)");G.wa.setAttribute("transform","translate(-45 78) rotate("+(b*-13)+" 0 0)");G.wr.setAttribute("transform","translate(45 78) rotate("+(b*13)+" 0 0)");G.wh.setAttribute("transform","rotate("+(b*2)+" 0 0)")}
 if(a==="talk"){G.w.setAttribute("transform","translate(390 310)");G.wa.setAttribute("transform","translate(-45 78) rotate("+(10*s)+" 0 0)");G.wr.setAttribute("transform","translate(45 78) rotate("+(-25*s)+" 0 0)");G.wh.setAttribute("transform","rotate("+(b*3)+" 0 0)");G.mh.setAttribute("transform","rotate("+(-b*2)+" 0 0)");G.mr.setAttribute("transform","translate(48 75) rotate("+(12*s)+" 0 0)")}
 if(a==="gesture"){G.w.setAttribute("transform","translate(390 310)");G.wr.setAttribute("transform","translate(45 78) rotate("+(-55*s)+" 0 0)");G.wa.setAttribute("transform","translate(-45 78) rotate("+(8*s)+" 0 0)");G.wh.setAttribute("transform","rotate("+(b*3)+" 0 0)")}
 if(a==="eat"){G.w.setAttribute("transform","translate(390 310)");const lift=38*s;G.wr.setAttribute("transform","translate(45 78) rotate("+(-62*s)+" 0 0)");G.wa.setAttribute("transform","translate(-45 78) rotate("+(20*s)+" 0 0)");G.wh.setAttribute("transform","translate(0 "+(-4*s)+") rotate("+(b*2)+" 0 0)");G.tray.setAttribute("transform","translate(0 "+(-lift)+")")}
 if(a==="listen"){G.w.setAttribute("transform","translate(390 310)");G.mh.setAttribute("transform","rotate("+(6*s)+" 0 0)");G.ma.setAttribute("transform","translate(-48 75) rotate("+(-18*s)+" 0 0)");G.mr.setAttribute("transform","translate(48 75) rotate("+(18*s)+" 0 0)");G.wh.setAttribute("transform","rotate("+(-4*s)+" 0 0)")}
 if(a==="idle"){G.w.setAttribute("transform","translate(390 310)");G.wh.setAttribute("transform","rotate("+(b*1.5)+" 0 0)");G.mh.setAttribute("transform","rotate("+(-b*1.2)+" 0 0)")}
}
function at(z){if(z<2.5)return["enter",z/2.5];if(z<4.8)return["talk",(z-2.5)/2.3];if(z<6)return["gesture",(z-4.8)/1.2];if(z<8.2)return["eat",(z-6)/2.2];if(z<10)return["listen",(z-8.2)/1.8];return["idle",(z-10)]}
function frame(now){t+=Math.min(.05,(now-last)/1000);last=now;let a=mode,p=0;if(mode==="scene"){[a,p]=at(t%11)}else p=(t%2)/2;apply(a,p);$("status").innerHTML='<span class="good">PASS · illustrated scene runtime alive</span>\nmode: '+mode+'\ncurrent action: '+a+'\nAI supplied: scene intent + timeline + targets + camera\nengine executes: enter / talk / gesture / eat / listen / idle\nAI/frame: 0\n\nScene plan:\n'+JSON.stringify(aiPlan,null,2);requestAnimationFrame(frame)}
document.querySelectorAll("button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;t=0;document.querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b))});
document.querySelector('button[data-m="scene"]').classList.add("active");requestAnimationFrame(frame);
</script>
</body></html>
